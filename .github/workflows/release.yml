name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Verify before releasing
        run: npm run check

      - name: Tag matches manifest version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST=$(node -p "require('./manifest.json').version")
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $MANIFEST"
            exit 1
          fi
          echo "Releasing $MANIFEST"

      - name: Build extension zip
        # Delegates to the same script `npm run package` uses locally, so
        # there's exactly one place that lists which files ship — not two
        # copies that can silently drift apart. (They already had: this
        # workflow's own file list was missing history.js, historyLib.js,
        # and drive.js, all three of which dial.js imports at runtime, so
        # every release zip built by this workflow would have failed to
        # load at all.)
        #
        # No rename needed: npm's package script names its output
        # daily-dial-v<version>.zip, and the "Tag matches manifest version"
        # step above already guarantees <version> equals GITHUB_REF_NAME
        # (which is the "v1.2.3" tag itself) — so the two names are always
        # identical already. A previous version of this step tried to `mv`
        # one onto the other anyway and failed outright ("same file").
        run: |
          npm run package
          unzip -l "daily-dial-${GITHUB_REF_NAME}.zip"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: daily-dial-${{ github.ref_name }}.zip
          generate_release_notes: true
          body: |
            Install the zip by unpacking it and loading the folder via
            `chrome://extensions` → Developer mode → **Load unpacked**.

            See [CHANGELOG.md](CHANGELOG.md) for what changed.
