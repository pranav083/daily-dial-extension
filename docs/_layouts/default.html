<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title and page.title != site.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
<link rel="icon" href="{{ '/assets/icon-48.png' | relative_url }}">
<meta property="og:title" content="{{ page.title | default: site.title }}">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:type" content="website">
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <a class="home" href="{{ '/' | relative_url }}">Daily Dial</a>
    <nav>
      <a href="{{ '/about.html' | relative_url }}">About</a>
      <a href="{{ '/GETTING_STARTED.html' | relative_url }}">Getting started</a>
      <a href="https://github.com/pranav083/daily-dial-extension">GitHub</a>
    </nav>
  </header>

  {{ content }}

  <footer class="site-foot">
    Daily Dial is free and open source, MIT licensed.
    <a href="https://github.com/pranav083/daily-dial-extension/blob/main/PRIVACY.md">Privacy</a> ·
    <a href="https://github.com/pranav083/daily-dial-extension/issues/new/choose">Report a bug</a> ·
    <a href="https://github.com/pranav083/daily-dial-extension">Source</a>
  </footer>
</div>
</body>
</html>
