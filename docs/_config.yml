# GitHub Pages serves this folder. Kept deliberately plain: the guides are
# prose, and a heavier theme would be another thing to keep working.
title: Daily Dial
description: Time tracking that shows you where the day actually went — and guides for taking the day back.
# No remote theme: the site uses the extension's own palette and faces,
# defined in assets/style.css and _layouts/default.html.
show_downloads: false
# Files that belong to the repo rather than the site.
exclude:
  - STORE_LISTING.md
  - store/

# Jekyll drops directories whose names start with an underscore. The demo
# loads its message catalogs from _locales at runtime, so without this the
# playable demo publishes with every string missing and falls back to
# humanised key names.
include:
  - _locales
